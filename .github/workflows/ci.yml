name: Verificar y compilar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Verificar empaquetado IPA
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - run: flutter build apk --debug
      - name: Verificar el instalador Android
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: acrostella-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    runs-on: macos-15
    env:
      # video_player_avfoundation uses AVFoundation concurrency APIs absent
      # from the runner's default Xcode 16.4 SDK.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Registrar herramientas Apple
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Compilar para dispositivo sin firma
        run: flutter build ios --release --no-codesign
      - name: Empaquetar resultado sin firma
        run: |
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app build/ios/acrostella-unsigned.zip
          python3 tool/package_unsigned_ipa.py build/ios/acrostella-unsigned.zip build/ios/ipa
      - uses: actions/upload-artifact@v4
        with:
          name: acrostella-ios-unsigned
          path: |
            build/ios/ipa/*.ipa
            build/ios/ipa/*.sha256
          if-no-files-found: error
          retention-days: 7
