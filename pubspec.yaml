name: acrostella_analytics
description: Captura y análisis deportivo local para iPad y Android.
publish_to: 'none'
version: 0.6.0+8

environment:
  sdk: ^3.13.3
  flutter: 3.47.3

dependencies:
  flutter:
    sdk: flutter
  crypto: 3.0.7
  path_provider: 2.1.6
  video_player: 2.14.1
  cryptography: 2.9.0
  file_selector: 1.1.0
  share_plus: 12.0.1
  flutter_webrtc:
    path: third_party/flutter_webrtc
  liquid_glass_renderer: 0.2.0-dev.4
  flutter_secure_storage: 10.0.0
  package_info_plus: 9.0.0
  dsrp: 0.5.5
  nsd: 5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: 6.9.0

flutter:
  uses-material-design: true
